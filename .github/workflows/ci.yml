name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt httpx pytest
      - name: 生成合成 demo 数据
        run: python scripts/make_demo_db.py
      - name: 冒烟 + demo 数据测试
        run: pytest test_smoke.py tests/ -v
